name: Android CI - Build APK

on:
  push:
    branches: [fitcoach-grafica, fitcoach-2.0-clean, main]
  pull_request:
    branches: [fitcoach-grafica, fitcoach-2.0-clean, main]
  workflow_dispatch:

jobs:
  build:
    name: Test e build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test unitari
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build APK debug (firma stabile versionata)
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Build APK release (non firmato)
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Verifica APK
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          echo "== Firma =="
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          echo "== Allineamento =="
          "$BT/zipalign" -c -v 4 app/build/outputs/apk/debug/app-debug.apk
          echo "== Package =="
          "$BT/aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk | grep '^package'

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: fitcoach-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK release
        uses: actions/upload-artifact@v4
        with:
          name: fitcoach-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
